spring.datasource.url=jdbc:h2:mem:cardhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.task.scheduling.enabled=false
cardhub.auth.jwt-secret=cardhub-test-jwt-secret-that-is-at-least-32-bytes
cardhub.auth.access-token-ttl=30m
cardhub.auth.refresh-token-ttl=14d
cardhub.auth.refresh-cookie-name=cardhub_refresh
cardhub.auth.refresh-cookie-secure=false
cardhub.auth.oauth-success-url=http://localhost:3000/auth/callback
cardhub.cors.allowed-origins=http://localhost:3000
